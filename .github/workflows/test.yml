name: Test — Traffic Monitor

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-totals-only:
    name: Totals only (default, no sudo needed)
    runs-on: ubuntu-latest
    steps:
      - uses: muldos/ci-traffic-monitor@main
        # detailed not set → defaults to false

      - name: Download 10 MB (OVH)
        run: curl -fsSL -o /dev/null https://proof.ovh.net/files/10Mb.dat

      - name: Download 100 MB (OVH)
        run: curl -fsSL -o /dev/null https://proof.ovh.net/files/100Mb.dat

  test-detailed:
    name: Detailed breakdown (iptables, sudo required)
    runs-on: ubuntu-latest
    steps:
      - uses: muldos/ci-traffic-monitor@main
        with:
          detailed: 'true'

      - name: Download 10 MB (OVH)
        run: curl -fsSL -o /dev/null https://proof.ovh.net/files/10Mb.dat

      - name: npm install (small)
        run: npm install --prefix /tmp/test-pkg cowsay

      - name: Pull Docker image
        run: docker pull alpine:latest
